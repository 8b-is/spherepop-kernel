name: ci

on:
  push:
    branches: [main, "gate-*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Check zero-emoji policy
        run: go run ./tools/noemoji

      - name: Run Go test suite and Python conformance crosscheck
        run: go test ./...

      - name: Run encode benchmarks (smoke)
        run: go test -run=^$ -bench=. -benchtime=100ms ./encode/...

      - name: Run independent Zig verifier
        run: zig test verifiers/zig/src/verifier.zig
